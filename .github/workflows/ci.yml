name: nanofix ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  version:
    runs-on: ubuntu-24.04
    name: version consistency
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Configure (CMake generates version.hpp)
        run: |
          cmake -S . -B build-version \
            -DNANOFIX_BUILD=OFF -DNANOFIX_BUILD_FIXSPEC_GEN=OFF \
            -DNANOFIX_LTO=OFF -DNANOFIX_NATIVE_ARCH=OFF
      - name: Cross-check version.py vs CMake-generated header
        run: python3 scripts/version.py --check build-version/nanofix-generated/include/nanofix/detail/version.hpp
      - name: Cross-check CMake project version
        run: |
          cmake_base=$(grep -m1 '^CMAKE_PROJECT_VERSION:' build-version/CMakeCache.txt | cut -d= -f2)
          script_full=$(python3 scripts/version.py --print)
          echo "cmake=${cmake_base} script=${script_full}"
          test "${script_full%%+*}" = "${cmake_base}"
      - name: Cross-check Conan set_version
        run: |
          pip install 'conan==2.30.0'
          conan_v=$(conan inspect . --format=json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          script_v=$(python3 scripts/version.py --print)
          echo "conan=${conan_v} script=${script_v}"
          test "${conan_v}" = "${script_v}"

  format:
    runs-on: ubuntu-24.04
    name: clang-format check
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install clang-format (pinned)
        run: pip install 'clang-format==20.1.8'
      - name: Run format_check.sh
        run: scripts/format_check.sh

  clang-tidy:
    runs-on: ubuntu-24.04
    name: clang-tidy
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install clang-tidy (pinned), Conan, Ninja, clang
        run: |
          pip install 'clang-tidy==20.1.0' 'conan==2.30.0'
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
      - name: Detect Conan profile
        run: conan profile detect --force
      - name: Conan install
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=20 \
            -s:b compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja \
            -c:h "tools.build:compiler_executables={\"c\":\"clang\",\"cpp\":\"clang++\"}"
      - name: CMake configure (export compile_commands.json)
        run: cmake --preset conan-release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build benchmarks
        run: cmake --build build/build/Release --target nanofix_benchmarks --parallel
      - name: Run lint.sh
        run: scripts/lint.sh build/build/Release

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++
            conan_extra: ""
          - os: ubuntu-24.04
            compiler: clang
            cc: clang
            cxx: clang++
            conan_extra: ""
          - os: macos-15
            compiler: apple-clang
            cc: clang
            cxx: clang++
            conan_extra: ""
          - os: windows-2025
            compiler: msvc
            cc: cl
            cxx: cl
            conan_extra: ""
          - os: windows-2025
            compiler: clang-cl
            cc: clang-cl
            cxx: clang-cl
            conan_extra: "-s:h compiler=msvc -s:h compiler.version=${MSVC_VER} -s:h compiler.runtime=dynamic -s:b compiler=msvc -s:b compiler.version=${MSVC_VER} -s:b compiler.runtime=dynamic"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4.3.1

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install 'conan==2.30.0'
          conan --version

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if not defined INCLUDE exit /b 1
          echo PATH=%PATH%>> "%GITHUB_ENV%"
          echo INCLUDE=%INCLUDE%>> "%GITHUB_ENV%"
          echo LIB=%LIB%>> "%GITHUB_ENV%"
          echo LIBPATH=%LIBPATH%>> "%GITHUB_ENV%"
 
      - name: Detect MSVC toolset version (Windows)
        if: runner.os == 'Windows'
        run: |
          ver=$(cl 2>&1 | sed -nE 's/.*Version ([0-9]+)\.([0-9]{2}).*/\1\2/p' | head -1 | cut -c1-3)
          [ -n "$ver" ] || { echo "could not parse cl version"; exit 1; }
          echo "cl toolset -> conan msvc compiler.version=$ver"
          echo "MSVC_VER=$ver" >> "$GITHUB_ENV"

      - name: Cache Conan packages
        uses: actions/cache@v4.3.0
        with:
          path: ~/.conan2
          key: conan2-${{ matrix.os }}-${{ matrix.compiler }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan2-${{ matrix.os }}-${{ matrix.compiler }}-

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Conan install
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=20 \
            -s:b compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja \
            -c:h "tools.build:compiler_executables={\"c\":\"${{ matrix.cc }}\",\"cpp\":\"${{ matrix.cxx }}\"}" \
            ${{ matrix.conan_extra }}

      - name: CMake configure
        run: cmake --preset conan-release

      - name: CMake build
        run: cmake --build build/build/Release --config Release --parallel

      - name: ctest
        run: ctest --test-dir build/build/Release --build-config Release --output-on-failure --parallel 4

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - { name: asan, flag: NANOFIX_SANITIZE,        opts: "ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1" }
          - { name: tsan, flag: NANOFIX_SANITIZE_THREAD, opts: "TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1" }
    runs-on: ubuntu-24.04
    name: ubuntu / clang / ${{ matrix.sanitizer.name }}
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install Conan + tools
        run: |
          python -m pip install --upgrade pip
          pip install 'conan==2.30.0'
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Cache Conan packages
        uses: actions/cache@v4.3.0
        with:
          path: ~/.conan2
          key: conan2-${{ matrix.sanitizer.name }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan2-${{ matrix.sanitizer.name }}-

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Conan install (Debug, no LTO)
        run: |
          conan install . \
            --output-folder=build-${{ matrix.sanitizer.name }} \
            --build=missing \
            -s build_type=Debug \
            -s compiler.cppstd=20 \
            -s:b compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja \
            -c 'tools.build:compiler_executables={"c":"clang","cpp":"clang++"}'

      - name: CMake configure
        run: |
          cmake --preset conan-debug \
            -D${{ matrix.sanitizer.flag }}=ON \
            -DNANOFIX_LTO=OFF \
            -DNANOFIX_NATIVE_ARCH=OFF

      - name: CMake build
        run: cmake --build build-${{ matrix.sanitizer.name }}/build/Debug --parallel

      - name: ctest
        run: |
          export ${{ matrix.sanitizer.opts }}
          ctest --test-dir build-${{ matrix.sanitizer.name }}/build/Debug --output-on-failure --parallel 4

  fuzz:
    runs-on: ubuntu-24.04
    name: ubuntu / clang / libFuzzer (60s)
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
      - name: Configure fuzz harness
        run: |
          cmake -S fuzz -B build/fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build fuzz_reader
        run: cmake --build build/fuzz --target fuzz_reader --parallel
      - name: Seed corpus
        run: cmake --build build/fuzz --target fuzz_dataset
      - name: Restore fuzz corpus
        uses: actions/cache@v4.3.0
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      - name: Run libFuzzer (60s, halt on crash)
        env:
          NANOFIX_FUZZ_MAX_TIME: 60
        run: |
          mkdir -p fuzz-corpus
          build/fuzz/fuzz_reader \
            -max_total_time=${NANOFIX_FUZZ_MAX_TIME} \
            -timeout=10 \
            -rss_limit_mb=2048 \
            -dict=fuzz/fix.dict \
            fuzz-corpus build/fuzz/dataset
      - name: Upload crashes (if any)
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  scalar:
    runs-on: ubuntu-24.04
    name: ubuntu / clang / NANOFIX_DISABLE_SIMD
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install Conan and Ninja
        run: |
          python -m pip install --upgrade pip
          pip install 'conan==2.30.0'
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Cache Conan packages
        uses: actions/cache@v4.3.0
        with:
          path: ~/.conan2
          key: conan2-scalar-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan2-scalar-
      - name: Detect Conan profile
        run: conan profile detect --force
      - name: Conan install
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=20 \
            -s:b compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja \
            -c:h "tools.build:compiler_executables={\"c\":\"clang\",\"cpp\":\"clang++\"}"
      - name: CMake configure (SIMD off)
        run: cmake --preset conan-release -DNANOFIX_DISABLE_SIMD=ON
      - name: CMake build
        run: cmake --build build/build/Release --parallel
      - name: ctest
        run: ctest --test-dir build/build/Release --output-on-failure --parallel 4

  examples:
    runs-on: ubuntu-24.04
    name: ubuntu / clang / examples (standalone Conan)
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install Conan + tools
        run: |
          python -m pip install --upgrade pip
          pip install 'conan==2.30.0'
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Cache Conan packages
        uses: actions/cache@v4.3.0
        with:
          path: ~/.conan2
          key: conan2-examples-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan2-examples-

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Publish nanofix to local Conan cache
        run: |
          conan create . \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=20 \
            -s:b compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja \
            -c tools.build:skip_test=True

      - name: Build + run fix44_gateway
        run: |
          cd examples/fix44_gateway
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=20 \
            -s:b compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja
          cmake --preset conan-release
          cmake --build build/build/Release --parallel
          ./build/build/Release/fix44_gateway

      - name: Build + run fix50_mdmonitor
        run: |
          cd examples/fix50_mdmonitor
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=20 \
            -s:b compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja
          cmake --preset conan-release
          cmake --build build/build/Release --parallel
          ./build/build/Release/fix50_mdmonitor

  docs:
    runs-on: ubuntu-24.04
    name: ubuntu / doxygen build
    env:
      DOXYGEN_VERSION: "1.17.0"
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      - name: Install doxygen (pinned ${{ env.DOXYGEN_VERSION }})
        run: |
          set -euo pipefail
          curl -fsSL -o doxygen.tar.gz \
            "https://www.doxygen.nl/files/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tar xf doxygen.tar.gz
          sudo install -m 0755 "doxygen-${DOXYGEN_VERSION}/bin/doxygen" /usr/local/bin/doxygen
          doxygen --version
      - name: Configure
        run: cmake -S . -B build-docs -DNANOFIX_BUILD=OFF -DNANOFIX_BUILD_DOCS=ON
      - name: Build docs
        run: cmake --build build-docs --target docs 2>&1 | tee doxygen.log
      - name: Fail on doxygen warnings
        run: |
          if grep -E "^[^:]+:[0-9]+: warning:" doxygen.log; then
            echo "Doxygen produced warnings"; exit 1
          fi
